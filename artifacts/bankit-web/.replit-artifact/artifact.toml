kind = "web"
previewPath = "/"
title = "Bankit Web"
version = "1.0.0"
id = "artifacts/bankit-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20866

[services.development]
run = "pnpm --filter @workspace/bankit-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bankit-web", "run", "build" ]
publicDir = "artifacts/bankit-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20866"
BASE_PATH = "/"
